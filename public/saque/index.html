    <!-- Tailwind via CDN com as mesmas configs -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              "yt-black": "#050811",
              "yt-red": "#ff0000",
              "yt-text": "#ffffff",
            },
            fontFamily: {
              roboto: ["Roboto", "sans-serif"],
              oswald: ["Oswald", "sans-serif"],
              "roboto-condensed": ['"Roboto Condensed"', "sans-serif"],
            },
          },
        },
      };
    </script>
    <!-- Ícones Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- ðŸ”¥ COLOQUE SEU PIXEL / SCRIPT AQUI -->

    <!-- Meta Pixel Code -->

    <noscript></noscript>
    <!-- End Meta Pixel Code -->
    <!-- 🔥 COLOQUE SEU PIXEL / SCRIPT AQUI -->

    <link rel="stylesheet" href="saque.css" />
  </head>
  <body class="poster-bg bg-[#050505] text-white min-h-screen relative overflow-x-hidden selection:bg-red-500/30">
        

    
<!-- Tela de Carregamento Profissional -->

    <div class="relative z-10 w-full min-h-screen flex flex-col">
      <!-- Header modificado -->
      <header
        class="relative z-50 px-5 pt-5 pb-1 transition-all duration-300 flex flex-col items-center justify-center gap-2"
      >
        <div class="flex items-center justify-center gap-3 w-full select-none">
          <div class="flex items-center gap-1.5">
            <img src="../assets/youtube_icon.svg" class="h-6 sm:h-7 w-auto drop-shadow-[0_0_10px_rgba(255,0,0,0.14)]" alt="YouTube">
            <span class="text-white font-black text-[1.3rem] sm:text-[1.5rem] leading-none font-roboto-condensed tracking-[-0.04em]">YouTube</span>
          </div>
          <span class="text-zinc-600 font-bold mx-1">×</span>
          <div class="flex items-center">
            <img src="../assets/kwai_logo.png" class="h-16 sm:h-12 w-auto object-contain drop-shadow-[0_0_12px_rgba(255,145,0,0.14)]" alt="Kwai">
          </div>
        </div>
        <div class="flex items-center justify-center w-full max-w-xs mt-0.5">
          <div
            class="flex items-center justify-between w-full bg-[#0d1624]/85 border border-[#1e2d42] rounded-xl px-4 py-1.5 shadow-lg shadow-black/35 animate-scale-in"
          >
            <span class="text-[10px] text-zinc-400 uppercase font-bold"
              >Saldo Disponível</span
            >
            <span
              class="text-[#d5ff2a] font-bold font-mono text-lg text-neon-glow"
              >R$ 3.096,04</span
            >
          </div>
        </div>
      </header>
      <!-- Container Dinâmico -->
      <main class="flex-1 flex flex-col justify-start py-3" id="app">
        <div class="text-center mb-4 px-4 select-none mt-1">
          <span class="hero-word text-4xl md:text-5xl inline-block mt-4">VERIFICAÇÃO<br/>DE SEGURANÇA</span>
        </div>
        <div
          class="px-4 py-1 max-w-md w-full mx-auto flex flex-col animate-fade-in-up"
        >
          <div
            class="bg-[#0d1624]/95 border border-[#1e2d42] rounded-2xl p-5 shadow-2xl relative overflow-hidden"
          >
            <div class="relative z-10 flex flex-col items-center text-center">
              <h1
                class="text-xl font-black font-oswald uppercase text-white mb-3 leading-tight"
              >
                Assista o vídeo abaixo para liberar o seu acesso
              </h1>
              <div
                class="bg-zinc-950/70 rounded-xl p-5 mb-5 border border-[#1e2d42] w-full"
              >
                <p
                  class="text-zinc-500 text-[11px] uppercase mb-1.5 font-bold font-roboto"
                >
                  Dados do seu resgate - Valor Disponível
                </p>
                <p
                  class="text-[#d5ff2a] font-bold text-4xl font-mono text-neon-glow"
                >
                  R$ 3.096,04
                </p>
              </div>
              <!-- Box do Vídeo -->
              <div
                class="w-full flex items-center justify-center mb-4 rounded-xl overflow-hidden border border-[#1e2d42] bg-black relative"
              >
                <video
                  class="w-full h-auto"
                  controls=""
                  id="verification-video"
                  playsinline=""
                  src="/assets/video1.mov"
                ></video>
                <div
                  class="absolute inset-0 z-20 flex items-center justify-center bg-black/60 cursor-pointer backdrop-blur-sm"
                  id="unmute-overlay"
                >
                  <div
                    class="bg-[#d5ff2a] text-black font-black px-4 py-2 rounded-full flex items-center gap-2 animate-bounce"
                  >
                    <svg
                      aria-hidden="true"
                      class="lucide lucide-volume-2 w-5 h-5"
                      data-lucide="volume-2"
                      fill="none"
                      height="24"
                      stroke="currentColor"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      viewbox="0 0 24 24"
                      width="24"
                      xmlns="http://www.w3.org/2000/svg"
                    >
                      <path
                        d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"
                      ></path>
                      <path d="M16 9a5 5 0 0 1 0 6"></path>
                      <path d="M19.364 18.364a9 9 0 0 0 0-12.728"></path>
                    </svg>
                    <span>CLIQUE PARA OUVIR</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div
            class="mt-4 flex items-center justify-center gap-1.5 text-[10px] font-bold text-zinc-500 uppercase"
          >
            <svg
              aria-hidden="true"
              class="lucide lucide-shield-check w-4 h-4 text-zinc-500"
              data-lucide="shield-check"
              fill="none"
              height="24"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              viewbox="0 0 24 24"
              width="24"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"
              ></path>
              <path d="m9 12 2 2 4-4"></path>
            </svg>
            <span>Ambiente 100% Seguro &amp; Verificado</span>
          </div>
        </div>
      </main>
    </div>
    <script src="saque.js"></script>
  </body>
</html>
